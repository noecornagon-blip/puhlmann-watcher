<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Veille matos</title>
<style>
:root{--ink:#222;--mute:#717171;--line:#ddd;--soft:#f7f7f7;--rose:#ff385c;--rose2:#e31c5f;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.4 "Circular",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{padding:0 clamp(16px,4vw,80px)}

/* header */
header{position:sticky;top:0;z-index:30;background:#fff}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:80px}
.logo{display:flex;align-items:center;gap:8px;color:var(--rose);font-weight:800;font-size:22px;letter-spacing:-.04em;text-decoration:none}
.logo svg{width:30px;height:30px}
.pill{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;box-shadow:0 3px 10px #0000001a;padding:7px 8px 7px 24px;gap:12px;min-width:min(520px,52vw);background:#fff;transition:box-shadow .2s}
.pill:hover,.pill:focus-within{box-shadow:0 4px 14px #00000026}
.pill label{display:flex;flex-direction:column;flex:1;min-width:0}
.pill label span{font-size:11px;font-weight:700}
.pill input{border:0;outline:0;font:inherit;font-size:14px;color:var(--ink);background:none;padding:0;width:100%}
.pill input::placeholder{color:var(--mute)}
.pill .sep{width:1px;height:28px;background:var(--line)}
.pill .go{width:36px;height:36px;border-radius:50%;border:0;background:var(--rose);color:#fff;display:grid;place-items:center;flex:none}
.pill .go svg{width:15px;height:15px}
.right{display:flex;justify-content:flex-end;gap:8px}
.ghost{border:1px solid transparent;background:none;border-radius:999px;padding:10px 14px;font-weight:600;font-size:14px;display:flex;gap:7px;align-items:center}
.ghost:hover{background:var(--soft)}
.ghost.on{border-color:var(--ink)}
.ghost .n{background:var(--rose);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px;font-weight:700}

/* catégories */
.cats{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ebebeb}
.cats .scroll{display:flex;gap:clamp(18px,3vw,36px);overflow-x:auto;scrollbar-width:none;flex:1;padding:6px 2px 0}
.cats .scroll::-webkit-scrollbar{display:none}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 12px;color:var(--mute);border-bottom:2px solid transparent;opacity:.8;white-space:nowrap;font-size:12px;font-weight:600}
.cat:hover{color:var(--ink);border-bottom-color:#ddd;opacity:1}
.cat.on{color:var(--ink);border-bottom-color:var(--ink);opacity:1}
.cat .ic{font-size:24px;line-height:1;filter:grayscale(.15)}
.cat small{font-weight:500;color:var(--mute)}
.filterbtn{border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 16px;font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:center;flex:none;margin-left:8px}
.filterbtn:hover{border-color:var(--ink);background:var(--soft)}
.filterbtn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* grille */
main{padding-top:24px;padding-bottom:70px}
.info{color:var(--mute);margin:0 0 18px;font-size:14px}
.grid{display:grid;gap:36px 24px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{cursor:pointer;display:block;min-width:0}
.pic{position:relative;aspect-ratio:20/19;border-radius:var(--r);overflow:hidden;background:#ebebeb}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .15s}
.pic .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:13px}
.heart{position:absolute;top:12px;right:12px;width:32px;height:32px;border:0;background:none;padding:0;z-index:2;display:grid;place-items:center;transition:transform .15s}
.heart:hover{transform:scale(1.12)}
.heart svg{width:26px;height:26px;fill:#00000080;stroke:#fff;stroke-width:2;overflow:visible;filter:drop-shadow(0 1px 2px #0003)}
.heart.on svg{fill:var(--rose)}
.tag{position:absolute;top:12px;left:12px;background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;box-shadow:0 1px 3px #0003;z-index:2}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:#ffffffe6;box-shadow:0 1px 4px #0004;display:grid;place-items:center;opacity:0;transition:opacity .15s,transform .15s;z-index:2;font-size:15px;font-weight:700;padding:0}
.arr:hover{transform:translateY(-50%) scale(1.06);background:#fff}
.arr.l{left:10px}.arr.r{right:10px}
.pic:hover .arr{opacity:1}
@media(hover:none){.arr{opacity:.9}}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:4px;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:#ffffff99}
.dots i.on{background:#fff;transform:scale(1.2)}
.txt{padding-top:10px;display:grid;gap:1px;min-width:0}
.l1{min-width:0;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
.l1 b{min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l2,.l3{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l4{margin-top:5px;font-size:15px}
.l4 b{font-weight:600}
.l4 em{font-style:normal;color:var(--mute);font-size:13px}
.empty{text-align:center;padding:90px 0;color:var(--mute)}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:22px}
.btn{border:0;border-radius:10px;padding:13px 22px;font-weight:600;font-size:15px;text-decoration:none;display:inline-block;text-align:center}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#000}
.btn.rose{background:linear-gradient(to right,#e61e4d,#e31c5f 50%,#d70466);color:#fff}
.btn.rose:hover{filter:brightness(.95)}
.btn.line{background:#fff;border:1px solid var(--ink)}.btn.line:hover{background:var(--soft)}
footer{border-top:1px solid #ebebeb;background:var(--soft);padding:22px 0;color:var(--mute);font-size:13px}

/* modales */
dialog{border:0;padding:0;border-radius:20px;color:var(--ink);box-shadow:0 20px 70px #0005;max-width:94vw;max-height:94vh;overflow:hidden}
dialog::backdrop{background:#0008}
.mh{display:flex;align-items:center;justify-content:center;position:relative;padding:18px 24px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
.x{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:none;font-size:18px}
.x:hover{background:var(--soft)}
#fd{width:640px}
.fb{padding:6px 24px 20px;overflow:auto;max-height:calc(94vh - 150px)}
.fs{padding:22px 0;border-bottom:1px solid #ebebeb}
.fs:last-child{border:0}
.fs h3{margin:0 0 14px;font-size:20px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.opt{display:flex;gap:12px;align-items:center;font-size:15px;cursor:pointer}
.opt input{appearance:none;width:24px;height:24px;border:1px solid #b0b0b0;border-radius:6px;display:grid;place-items:center;flex:none;margin:0;cursor:pointer}
.opt input[type=radio]{border-radius:50%}
.opt input:checked{background:var(--ink);border-color:var(--ink)}
.opt input:checked::after{content:"";width:8px;height:8px;background:#fff;border-radius:50%}
.opt small{color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:2px}
.price-in{display:flex;gap:14px;align-items:center}
.price-in label{flex:1;border:1px solid #b0b0b0;border-radius:12px;padding:8px 14px;display:flex;flex-direction:column}
.price-in label:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.price-in span{font-size:12px;color:var(--mute)}
.price-in input{border:0;outline:0;font:inherit;font-size:16px;width:100%;padding:0}
.mf{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--line)}
.mf .clear{background:none;border:0;text-decoration:underline;font-weight:600;font-size:16px;padding:8px}

#ld{width:min(1040px,94vw);border-radius:22px;overflow:auto;max-height:94vh}
.gal{display:grid;gap:8px;grid-template-columns:2fr 1fr 1fr;grid-template-rows:200px 200px;border-radius:14px;overflow:hidden;margin:0 24px}
.gal button{border:0;padding:0;background:#ebebeb;overflow:hidden;cursor:pointer}
.gal button:first-child{grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s}
.gal button:hover img{filter:brightness(.88)}
.gal.one{grid-template-columns:1fr;grid-template-rows:380px}
.gal.two{grid-template-columns:1fr 1fr;grid-template-rows:380px}
.gal.two button:first-child,.gal.one button:first-child{grid-row:auto}
.lb{display:grid;grid-template-columns:1fr 340px;gap:60px;padding:24px}
.lb h1{font-size:26px;font-weight:600;margin:0 0 4px;line-height:1.2}
.lb .sub{color:var(--mute);font-size:15px}
.lb hr{border:0;border-top:1px solid #ebebeb;margin:22px 0}
.lb .desc{white-space:pre-line;font-size:16px;line-height:1.55}
.buy{position:sticky;top:12px;align-self:start;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 6px 16px #0000001f;display:grid;gap:14px}
.buy .pr{font-size:26px;font-weight:600}
.buy .pr small{font-size:14px;font-weight:400;color:var(--mute)}
.buy .note{font-size:12.5px;color:var(--mute);text-align:center}
.lbtop{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 12px}
.lbtop .acts{display:flex;gap:4px}
.lbtop .ghost{padding:8px 12px;text-decoration:underline;font-size:14px}
@media(max-width:860px){.lb{grid-template-columns:1fr;gap:20px}.buy{position:static}.gal{grid-template-rows:160px 160px;margin:0 12px}.gal.one,.gal.two{grid-template-rows:260px}}

#nd{width:520px}
.push{margin:20px;display:flex;gap:11px;background:#f2f2f2;border-radius:18px;padding:12px;align-items:center}
.push .ico{width:40px;height:40px;border-radius:10px;background:var(--rose);display:grid;place-items:center;font-size:20px;flex:none}
.push .t{font-weight:600;font-size:14px;line-height:1.25}
.push .m{font-size:13.5px;color:#555;white-space:pre-line}
.push img{width:56px;height:56px;border-radius:8px;object-fit:cover;margin-left:auto;flex:none}
.mail{margin:0 20px 22px;border:1px solid var(--line);border-radius:14px;padding:16px;max-height:44vh;overflow:auto}
.mail h3{margin:0 0 4px}
.mail img{width:100%;border-radius:8px;margin:6px 0;display:block}

#vw{background:#000;width:100vw;max-width:100vw;height:100vh;max-height:100vh;border-radius:0}
#vw .stage{height:100%;display:grid;place-items:center;position:relative}
#vw img{max-width:96vw;max-height:84vh;object-fit:contain}
#vw .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
#vw .x{left:18px;top:30px;color:#fff;background:#fff2}
#vw .arr{opacity:1;width:44px;height:44px;font-size:20px}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:999px;padding:13px 22px;font-weight:600;box-shadow:0 8px 24px #0005;z-index:100;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#ff7d93;font-weight:700;text-decoration:underline;padding:0 0 0 4px}
@media(max-width:900px){.hd{grid-template-columns:auto 1fr;height:auto;padding-top:12px}.logo span{display:none}.pill{min-width:0;width:100%;grid-column:1/-1;order:3;margin-bottom:12px}.right{justify-self:end}.right .txt2{display:none}.pill .sep{display:none}}
@media(max-width:560px){.grid{grid-template-columns:1fr;gap:28px}.opts{grid-template-columns:1fr}.filterbtn span{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <a class="logo" href="#" onclick="resetAll();return false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 11h5l2-3h10l2 3h5v14H4z"/><circle cx="16" cy="17.5" r="4.5"/></svg><span>veille matos</span></a>
      <div class="pill">
        <label><span>Rechercher</span><input id="q" type="search" placeholder="Cooke, Alexa Mini, 50mm, moniteur…" autocomplete="off"></label>
        <i class="sep"></i>
        <label style="flex:.55"><span>Budget max (€)</span><input id="qmax" type="number" min="0" step="100" inputmode="numeric" placeholder="aucun"></label>
        <button class="go" aria-label="Rechercher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5.5 5.5"/></svg></button>
      </div>
      <div class="right"><button class="ghost" id="favBtn" title="Mes favoris"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8 2.8C20 15.8 12 21 12 21z"/></svg><span class="txt2">Favoris</span><span class="n" id="favN" hidden></span></button></div>
    </div>
    <div class="cats">
      <div class="scroll" id="cats"></div>
      <button class="filterbtn" id="openF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg><span>Filtres</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="info" id="info"></p>
  <div class="grid" id="grid"></div>
  <div id="sentinel" style="height:1px"></div>
  <div class="empty" id="empty" hidden><h2>Aucun résultat</h2><p>Essayez de modifier ou de supprimer certains filtres.</p><button class="btn dark" onclick="resetAll()">Tout effacer</button></div>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<dialog id="fd">
  <div class="mh"><button class="x" onclick="fd.close()" aria-label="Fermer">✕</button>Filtres</div>
  <div class="fb">
    <div class="fs"><h3>Trier par</h3><div class="opts" id="fSort"></div></div>
    <div class="fs"><h3>Fourchette de prix</h3><div class="price-in"><label><span>minimum</span><input id="pmin" type="number" min="0" step="100" placeholder="0 €"></label>–<label><span>maximum</span><input id="pmax" type="number" min="0" step="100" placeholder="aucun"></label></div></div>
    <div class="fs"><h3>Sites</h3><div class="opts" id="fSites"></div></div>
    <div class="fs"><h3>Options</h3><div class="opts">
      <label class="opt"><input type="checkbox" id="fNew">Nouveautés (7 jours)</label>
      <label class="opt"><input type="checkbox" id="fPrice">Prix indiqué uniquement</label></div></div>
  </div>
  <div class="mf"><button class="clear" onclick="resetFilters()">Tout effacer</button><button class="btn dark" id="fShow">Afficher</button></div>
</dialog>

<dialog id="ld"></dialog>
<dialog id="nd"></dialog>
<dialog id="vw"><button class="x" onclick="vw.close()">✕</button><div class="stage"><button class="arr l" id="vP">‹</button><img id="vI" alt=""><button class="arr r" id="vN">›</button><div class="cap" id="vC"></div></div></dialog>

<script>
let DATA = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur = (n) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
const COLORS = {puhlmann:'#2f6fed',alangordon:'#d9480f',awgear:'#2b9a66',newlifecine:'#9c36b5',newprovideo:'#e8590c',cinelenses:'#0c8599',broadcastsolutions:'#c2255c',cinemacameras:'#495057'};
const GROUPS = [['all','✨','Tout'],['cameras','🎥','Caméras'],['lenses','🔭','Optiques'],['monitors','🖥️','Moniteurs'],['lights','💡','Lumière'],['support','🏗️','Supports'],['audio','🎙️','Audio'],['accessories','🔋','Accessoires'],['other','📦','Autres']];
const SORTS = [['recent','Plus récentes'],['pasc','Prix croissant'],['pdesc','Prix décroissant'],['site','Par site']];
const WEEK = 7 * 864e5;
let items, sizes, byKey, ALL_SITES;
function ingest(D) {
  DATA = D; items = D.items;
  const GEN = new Date(D.generatedAt).getTime();
  sizes = {}; items.forEach((i) => sizes[i.site] = (sizes[i.site] || 0) + 1);
  for (const it of items) {
    const t = it.added ? +new Date(it.added) : (it.firstSeen ? +new Date(it.firstSeen) : 0);
    it._new = !!t && GEN - t < WEEK;
    it._hay = (it.title + ' ' + it.category + ' ' + it.description + ' ' + it.siteName).toLowerCase();
  }
  byKey = new Map(items.map((i) => [i.key, i]));
  ALL_SITES = D.sources.filter((s) => s.count).map((s) => s.id);
}
ingest(DATA);

let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('vm-favs') || '[]')); } catch {}
const saveFavs = () => { try { localStorage.setItem('vm-favs', JSON.stringify([...favs])); } catch {} };

const S = { group: 'all', sites: new Set(ALL_SITES), sort: 'recent', pmin: null, pmax: null, onlyNew: false, onlyPrice: false, favOnly: false, q: '', list: [], shown: 0 };
const PAGE = 40;

const priceHtml = (it) => {
  if (it.priceEUR == null) return `<b>Prix sur demande</b>`;
  const orig = it.currency === 'USD' ? ` <em>(${esc(it.price)})</em>` : (/HT/.test(it.price || '') ? ' <em>HT</em>' : '');
  return `<b>${eur(it.priceEUR)}</b>${orig}`;
};

/* ---------- catégories ---------- */
function renderCats() {
  const counts = {}; items.forEach((i) => { if (S.sites.has(i.site)) counts[i.group] = (counts[i.group] || 0) + 1; });
  counts.all = Object.values(counts).reduce((a, b) => a + b, 0);
  $('#cats').innerHTML = GROUPS.filter(([g]) => counts[g]).map(([g, ic, label]) =>
    `<button class="cat ${S.group === g ? 'on' : ''}" data-g="${g}"><span class="ic">${ic}</span>${label}<small>${counts[g].toLocaleString('fr-FR')}</small></button>`).join('');
}
$('#cats').addEventListener('click', (e) => { const b = e.target.closest('.cat'); if (!b) return; S.group = b.dataset.g; apply(); });

/* ---------- filtrage ---------- */
function filtered(st) {
  const q = st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return items.filter((it) => st.sites.has(it.site)
    && (st.group === 'all' || it.group === st.group)
    && (!st.favOnly || favs.has(it.key))
    && (!st.onlyNew || it._new)
    && (!st.onlyPrice || it.priceEUR != null)
    && (st.pmin == null || (it.priceEUR != null && it.priceEUR >= st.pmin))
    && (st.pmax == null || (it.priceEUR != null && it.priceEUR <= st.pmax))
    && q.every((w) => it._hay.includes(w)));
}
function apply() {
  const l = filtered(S);
  if (S.sort === 'recent') l.sort((a, b) => a.rank / sizes[a.site] - b.rank / sizes[b.site]);
  else if (S.sort === 'pasc') l.sort((a, b) => (a.priceEUR ?? Infinity) - (b.priceEUR ?? Infinity));
  else if (S.sort === 'pdesc') l.sort((a, b) => (b.priceEUR ?? -1) - (a.priceEUR ?? -1));
  else l.sort((a, b) => a.site.localeCompare(b.site) || a.rank - b.rank);
  S.list = l; S.shown = 0; $('#grid').innerHTML = '';
  const active = S.sites.size < ALL_SITES.length || S.sort !== 'recent' || S.pmin != null || S.pmax != null || S.onlyNew || S.onlyPrice;
  $('#info').textContent = `${l.length.toLocaleString('fr-FR')} annonce${l.length > 1 ? 's' : ''}${S.favOnly ? ' en favoris' : ''}`;
  $('#empty').hidden = l.length > 0;
  $('#openF').classList.toggle('on', active);
  $('#favBtn').classList.toggle('on', S.favOnly);
  const fn = $('#favN'); fn.hidden = !favs.size; fn.textContent = favs.size;
  if (document.activeElement !== $('#qmax')) $('#qmax').value = S.pmax ?? '';
  renderCats(); more();
}

/* ---------- cartes ---------- */
const HEART = '<svg viewBox="0 0 32 32"><path d="M16 28C7 22 2 16.6 2 11.2 2 7.2 5 4 8.9 4c2.7 0 5.2 1.5 7.1 4 1.9-2.5 4.4-4 7.1-4C27 4 30 7.2 30 11.2c0 5.4-5 10.8-14 16.8z"/></svg>';
function card(it, i) {
  const n = Math.min(it.photos.length, 8);
  return `<article class="card" data-i="${i}" data-p="0">
    <div class="pic">
      ${n ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(it.photos[0])}" alt="">` : '<div class="none">Pas de photo</div>'}
      ${it._new ? '<span class="tag">Nouveau</span>' : ''}
      <button class="heart ${favs.has(it.key) ? 'on' : ''}" data-act="fav" aria-label="Favori">${HEART}</button>
      ${n > 1 ? `<button class="arr l" data-act="prev">‹</button><button class="arr r" data-act="next">›</button><div class="dots">${Array.from({ length: Math.min(n, 5) }, (_, k) => `<i class="${k ? '' : 'on'}"></i>`).join('')}</div>` : ''}
    </div>
    <div class="txt">
      <div class="l1"><b title="${esc(it.title)}">${esc(it.title)}</b></div>
      <div class="l2">${esc(it.siteName)}${it.category ? ' · ' + esc(it.category) : ''}</div>
      <div class="l3">${esc((it.description || '').split('\n').find((x) => x.length > 3 && x !== it.title) || ' ')}</div>
      <div class="l4">${priceHtml(it)}</div>
    </div></article>`;
}
function more() {
  const next = S.list.slice(S.shown, S.shown + PAGE);
  $('#grid').insertAdjacentHTML('beforeend', next.map((it, k) => card(it, S.shown + k)).join(''));
  S.shown += next.length;
}
new IntersectionObserver((e) => { if (e[0].isIntersecting && S.shown < S.list.length) more(); }, { rootMargin: '1000px' }).observe($('#sentinel'));

function step(c, d) {
  const it = S.list[+c.dataset.i], n = Math.min(it.photos.length, 8);
  const p = (+c.dataset.p + d + n) % n; c.dataset.p = p;
  c.querySelector('.pic img').src = it.photos[p];
  c.querySelectorAll('.dots i').forEach((x, k) => x.classList.toggle('on', k === (n > 5 ? Math.min(p, 4) : p)));
}
function toggleFav(key) {
  favs.has(key) ? favs.delete(key) : favs.add(key); saveFavs();
  document.querySelectorAll('.card').forEach((c) => { const it = S.list[+c.dataset.i]; if (it) c.querySelector('.heart').classList.toggle('on', favs.has(it.key)); });
  const fn = $('#favN'); fn.hidden = !favs.size; fn.textContent = favs.size;
}
$('#grid').addEventListener('click', (e) => {
  const c = e.target.closest('.card'); if (!c) return;
  const act = e.target.closest('[data-act]')?.dataset.act, it = S.list[+c.dataset.i];
  if (act === 'prev') return step(c, -1);
  if (act === 'next') return step(c, 1);
  if (act === 'fav') { toggleFav(it.key); if (S.favOnly) apply(); return; }
  openListing(it);
});

/* ---------- fiche annonce ---------- */
function openListing(it) {
  const ph = it.photos.slice(0, 5), cls = ph.length >= 3 ? '' : ph.length === 2 ? 'two' : 'one';
  const gal = ph.length ? `<div class="gal ${cls}">${ph.map((p, k) => `<button data-v="${k}"><img referrerpolicy="no-referrer" src="${esc(p)}" alt=""></button>`).join('')}</div>` : '';
  const price = it.priceEUR != null ? eur(it.priceEUR) : 'Prix sur demande';
  const extra = it.priceEUR != null && it.currency === 'USD' ? `<small>(${esc(it.price)})</small>` : /HT/.test(it.price || '') ? '<small>HT</small>' : '';
  $('#ld').innerHTML = `<div class="mh" style="border:0"><button class="x" onclick="ld.close()" aria-label="Fermer">✕</button><span style="font-size:14px;font-weight:600;color:var(--mute)">${esc(it.siteName)}</span></div>
    <div class="lbtop"><div></div><div class="acts"><button class="ghost" data-do="notif">🔔 Aperçu notification</button><button class="ghost" data-do="fav">${favs.has(it.key) ? '♥ Enregistré' : '♡ Enregistrer'}</button></div></div>
    ${gal}
    <div class="lb"><div><h1>${esc(it.title)}</h1><div class="sub">${esc(it.siteName)}${it.category ? ' · ' + esc(it.category) : ''}${it._new ? ' · Nouveau' : ''}</div><hr>
      ${it.description ? `<div class="desc">${esc(it.description)}</div>` : '<div class="sub">Pas de description.</div>'}
      ${it.photos.length > 5 ? `<hr><button class="btn line" data-v="0">Voir les ${it.photos.length} photos</button>` : ''}</div>
      <aside class="buy"><div class="pr">${price} ${extra}</div>
      <a class="btn rose" href="${esc(it.url)}" target="_blank" rel="noopener">Voir l’annonce sur ${esc(it.siteName)} ↗</a>
      <div class="note">${it.currency === 'USD' && it.priceEUR != null ? `Converti au taux BCE du ${esc(DATA.usdEur.date)}. ` : ''}Vous serez redirigé vers le site du vendeur.</div></aside></div>`;
  $('#ld').dataset.key = it.key; $('#ld').scrollTop = 0; $('#ld').showModal();
}
$('#ld').addEventListener('click', (e) => {
  if (e.target === $('#ld')) return $('#ld').close();
  const it = byKey.get($('#ld').dataset.key);
  const v = e.target.closest('[data-v]'); if (v) return openViewer(it, +v.dataset.v);
  const b = e.target.closest('[data-do]'); if (!b) return;
  if (b.dataset.do === 'fav') { toggleFav(it.key); b.textContent = favs.has(it.key) ? '♥ Enregistré' : '♡ Enregistrer'; if (S.favOnly) apply(); }
  if (b.dataset.do === 'notif') showNotif(it);
});

/* ---------- aperçu notification ---------- */
function showNotif(it) {
  const lines = (it.description || '').split('\n').filter(Boolean).slice(0, 8);
  const price = it.priceEUR != null ? eur(it.priceEUR) : 'Prix sur demande';
  $('#nd').innerHTML = `<div class="mh"><button class="x" onclick="nd.close()">✕</button>Aperçu de la notification</div>
    <div class="push"><div class="ico">🆕</div><div><div class="t">🆕 ${esc(it.title)}</div><div class="m">${esc(price + ' · ' + it.siteName + (lines[0] ? '\n' + lines[0] : ''))}</div></div>${it.photos[0] ? `<img referrerpolicy="no-referrer" src="${esc(it.photos[0])}" alt="">` : ''}</div>
    <div class="mail"><h3>🆕 ${esc(it.title)}</h3><div style="font-size:18px;font-weight:700;margin-bottom:6px">💶 ${esc(price)} <span style="font-weight:400;color:var(--mute);font-size:13px">· ${esc(it.siteName)}</span></div>
    <ul>${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>${it.photos.slice(0, 4).map((p) => `<img referrerpolicy="no-referrer" src="${esc(p)}" alt="">`).join('')}<p><a href="${esc(it.url)}" target="_blank" rel="noopener">Voir l’annonce</a></p></div>`;
  $('#nd').showModal();
}

/* ---------- visionneuse ---------- */
let V = { it: null, p: 0 };
function openViewer(it, p) { V = { it, p }; drawV(); $('#vw').showModal(); }
function drawV() { $('#vI').src = V.it.photos[V.p]; $('#vC').textContent = `${V.p + 1} / ${V.it.photos.length}`; }
const stepV = (d) => { V.p = (V.p + d + V.it.photos.length) % V.it.photos.length; drawV(); };
$('#vP').onclick = () => stepV(-1); $('#vN').onclick = () => stepV(1);
$('#vw').addEventListener('click', (e) => { if (e.target.classList.contains('stage') || e.target.id === 'vw') $('#vw').close(); });
addEventListener('keydown', (e) => { if (!$('#vw').open) return; if (e.key === 'ArrowLeft') stepV(-1); if (e.key === 'ArrowRight') stepV(1); });

/* ---------- filtres ---------- */
function draft() {
  const sel = [...document.querySelectorAll('#fSites input:checked')].map((x) => x.dataset.site);
  return { ...S, sort: ($('#fSort input:checked') || {}).value || 'recent', sites: new Set(sel.length ? sel : ALL_SITES),
    pmin: $('#pmin').value === '' ? null : +$('#pmin').value, pmax: $('#pmax').value === '' ? null : +$('#pmax').value,
    onlyNew: $('#fNew').checked, onlyPrice: $('#fPrice').checked };
}
function buildFilters() {
  $('#fSort').innerHTML = SORTS.map(([v, l]) => `<label class="opt"><input type="radio" name="sort" value="${v}" ${S.sort === v ? 'checked' : ''}>${l}</label>`).join('');
  $('#fSites').innerHTML = DATA.sources.map((s) => `<label class="opt"><input type="checkbox" data-site="${s.id}" ${S.sites.has(s.id) ? 'checked' : ''} ${s.count ? '' : 'disabled'}><span><i class="dot" style="background:${COLORS[s.id] || '#888'}"></i>${esc(s.name)} <small>${s.ok ? s.count : '⚠ erreur'}</small></span></label>`).join('');
  $('#pmin').value = S.pmin ?? ''; $('#pmax').value = S.pmax ?? '';
  $('#fNew').checked = S.onlyNew; $('#fPrice').checked = S.onlyPrice; updShow();
}
function updShow() { $('#fShow').textContent = `Afficher ${filtered(draft()).length.toLocaleString('fr-FR')} annonces`; }
$('#fd').addEventListener('input', updShow); $('#fd').addEventListener('change', updShow);
$('#openF').onclick = () => { buildFilters(); $('#fd').showModal(); };
$('#fShow').onclick = () => { const d = draft(); Object.assign(S, { sort: d.sort, sites: d.sites, pmin: d.pmin, pmax: d.pmax, onlyNew: d.onlyNew, onlyPrice: d.onlyPrice }); $('#fd').close(); apply(); };
function resetFilters() { Object.assign(S, { sort: 'recent', sites: new Set(ALL_SITES), pmin: null, pmax: null, onlyNew: false, onlyPrice: false }); buildFilters(); }
function resetAll() { resetFilters(); S.group = 'all'; S.favOnly = false; S.q = ''; $('#q').value = ''; if ($('#fd').open) $('#fd').close(); apply(); scrollTo({ top: 0 }); }
document.querySelectorAll('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));

let t; $('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { S.q = $('#q').value; apply(); }, 150); });
$('#qmax').addEventListener('input', () => { S.pmax = $('#qmax').value === '' ? null : +$('#qmax').value; apply(); });
$('.pill .go').onclick = () => { S.q = $('#q').value; apply(); };
$('#favBtn').onclick = () => { S.favOnly = !S.favOnly; apply(); };

function renderFoot() { $('#foot').innerHTML = `Données du ${new Date(DATA.generatedAt).toLocaleString('fr-FR', { dateStyle: 'long', timeStyle: 'short' })} · ${items.length.toLocaleString('fr-FR')} annonces · ${DATA.sources.length} sites · Tous les prix sont en euros ; les prix en dollars sont convertis au taux BCE du ${DATA.usdEur.date} (1 $ = ${DATA.usdEur.rate.toFixed(4).replace('.', ',')} €). Prix hors taxes, tels qu’affichés par les vendeurs.${DATA.sources.some((s) => s.stale) ? ' ⚠ Certaines sources n’ont pas répondu : leurs annonces datent de la mise à jour précédente.' : ''}`; }
renderFoot();
apply();

/* ---------- actualisation automatique (toutes les 5 min quand la page est hébergée) ---------- */
const LIVE = /^https?:/.test(location.protocol);
let pending = null, toastTimer;
function toast(msg, action) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.innerHTML = esc(msg) + (action ? ` · <button>${esc(action)}</button>` : '');
  el.classList.add('show');
  el.querySelector('button')?.addEventListener('click', () => { showPending(); });
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), action ? 60000 : 6000);
}
function showPending() {
  if (!pending) return;
  const D = pending; pending = null;
  ingest(D);
  S.sites = new Set([...S.sites].filter((x) => ALL_SITES.includes(x))); if (!S.sites.size) S.sites = new Set(ALL_SITES);
  renderFoot(); apply(); $('#toast')?.classList.remove('show');
}
async function live() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const D = await r.json();
    if (!D.items || D.generatedAt === (pending || DATA).generatedAt) return;
    const known = new Set(items.map((i) => i.key));
    const added = D.items.filter((i) => !known.has(i.key));
    pending = D;
    const n = added.length, msg = n ? `${n} nouvelle${n > 1 ? 's' : ''} annonce${n > 1 ? 's' : ''}` : 'Liste mise à jour';
    if (scrollY < 300 && !document.querySelector('dialog[open]')) { showPending(); n && toast(msg); }
    else toast(msg, 'Afficher');
  } catch {}
}
if (LIVE) { setInterval(live, 5 * 60 * 1000); document.addEventListener('visibilitychange', () => { if (!document.hidden) live(); }); }
</script>
</body>
