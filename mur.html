<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Veille matos — Mur</title>
<meta name="description" content="Écran mural des dernières annonces de matériel détectées, actualisé en continu.">
<style>
:root{
  --bg:#0d0f13; --surf:#171b22; --surf2:#1e242d; --line:#2a313c;
  --ink:#f4f6f8; --mute:#98a2b3; --rose:#ff385c; --ok:#2bc46a; --warn:#f5a524;
  --r:16px;
  --pad:clamp(12px,1.6vh,28px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f7f9; --surf:#fff; --surf2:#f1f3f6; --line:#e3e6ea;
    --ink:#16181d; --mute:#6b7280;
  }
}
:root[data-theme="light"]{
  --bg:#f6f7f9; --surf:#fff; --surf2:#f1f3f6; --line:#e3e6ea;
  --ink:#16181d; --mute:#6b7280;
}
*{box-sizing:border-box;margin:0}
html{font-size:clamp(15px,1.15vh + .35vw,28px)}
body{
  height:100vh; overflow:hidden; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex; flex-direction:column;
}
body.idle{cursor:none}
a{color:inherit;text-decoration:none}

/* ---------- barre de progression vers la prochaine vérification ---------- */
#bar{height:.22rem;background:var(--rose);width:0;flex:none;transition:width .5s linear;opacity:.85}

/* ---------- en-tête ---------- */
header{
  flex:none; display:flex; align-items:center; gap:var(--pad);
  padding:var(--pad) calc(var(--pad)*1.4) calc(var(--pad)*.7);
}
.brand{display:flex;align-items:baseline;gap:.5rem;font-weight:800;letter-spacing:-.03em;font-size:1.5rem;white-space:nowrap}
.brand svg{width:1.5rem;height:1.5rem;flex:none;align-self:center}
.brand i{color:var(--mute);font-style:normal;font-weight:600;font-size:.85rem;letter-spacing:0}
.spacer{flex:1}
.chips{display:flex;gap:.5rem;flex:none}
.chip{
  background:var(--surf); border:1px solid var(--line); border-radius:999px;
  padding:.3rem .8rem; font-size:.82rem; font-weight:600; color:var(--mute); white-space:nowrap;
}
.chip b{color:var(--ink);font-size:1rem}
.chip.hot{border-color:var(--rose);color:var(--rose)}
.chip.hot b{color:var(--rose)}
.live{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--mute);white-space:nowrap}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 currentColor;animation:pulse 2.6s infinite}
.dot.bad{background:var(--warn);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 #2bc46a66}70%{box-shadow:0 0 0 .5rem #2bc46a00}100%{box-shadow:0 0 0 0 #2bc46a00}}
.live b{color:var(--ink);font-size:.95rem}
.iconbtn{
  background:var(--surf);border:1px solid var(--line);color:var(--mute);border-radius:999px;
  width:2rem;height:2rem;display:grid;place-items:center;font-size:.9rem;cursor:pointer;flex:none;
}
.iconbtn.on{border-color:var(--rose);color:var(--rose)}

/* ---------- grille ---------- */
main{
  flex:1; min-height:0; display:grid; gap:var(--pad);
  padding:0 calc(var(--pad)*1.4);
}
.card{
  background:var(--surf); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; display:flex; flex-direction:column; min-height:0; position:relative;
  animation:in .45s both;
}
@keyframes in{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
.card.just{border-color:var(--rose);box-shadow:0 0 0 .14rem #ff385c40}
.card.just .shot::after{content:"";position:absolute;inset:0;background:var(--rose);opacity:.22;animation:flash 1.6s 3 both}
@keyframes flash{0%,100%{opacity:0}50%{opacity:.22}}

.shot{position:relative;flex:1 1 auto;min-height:0;background:var(--surf2);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .ph{width:100%;height:100%;display:grid;place-items:center;font-size:2.4rem;opacity:.3}
.tags{position:absolute;top:.5rem;left:.5rem;right:.5rem;display:flex;gap:.4rem;align-items:flex-start}
.site{
  font-size:.7rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase;
  padding:.22rem .5rem;border-radius:.4rem;color:#fff;background:#555;backdrop-filter:blur(4px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%;
}
.new{
  margin-left:auto;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  padding:.22rem .5rem;border-radius:.4rem;background:var(--rose);color:#fff;white-space:nowrap;
}
.drop{
  margin-left:auto;font-size:.78rem;font-weight:800;letter-spacing:.01em;
  padding:.22rem .55rem;border-radius:.4rem;background:var(--ok);color:#06240f;white-space:nowrap;
}
.card.baisse{border-color:var(--ok)}
.card.baisse .shot::after{content:"";position:absolute;inset:0;background:var(--ok);opacity:.18;animation:flash 1.6s 3 both}
.price s{font-size:.78rem;font-weight:600;color:var(--mute);margin-right:.35rem;text-decoration-thickness:.08em}
.body{flex:none;padding:.65rem .8rem .7rem;display:flex;flex-direction:column;gap:.3rem}
.title{
  font-size:1rem;font-weight:700;line-height:1.25;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  height:2.5em; /* deux lignes réservées : toutes les cartes gardent la même hauteur */
}
.meta{display:flex;align-items:baseline;gap:.5rem;height:1.75rem}
.price{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.price small{font-size:.7rem;font-weight:600;color:var(--mute)}
.price.ask{font-size:1rem;color:var(--mute)}
.when{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--mute);white-space:nowrap}
.when.fresh{color:var(--rose)}

/* ---------- pied ---------- */
footer{
  flex:none; display:flex; align-items:center; gap:var(--pad);
  padding:calc(var(--pad)*.7) calc(var(--pad)*1.4) var(--pad);
  font-size:.78rem; color:var(--mute);
}
#srcs{display:flex;gap:.9rem;flex-wrap:wrap;min-width:0;overflow:hidden;height:1.2rem}
#srcs span{display:flex;align-items:center;gap:.32rem;white-space:nowrap}
#srcs i{width:.45rem;height:.45rem;border-radius:50%;background:var(--ok);display:block;flex:none}
#srcs i.stale{background:var(--warn)}
#srcs i.down{background:var(--rose)}
#pager{margin-left:auto;display:flex;align-items:center;gap:.45rem;flex:none}
#pager b{width:.5rem;height:.5rem;border-radius:50%;background:var(--line);display:block;transition:background .3s}
#pager b.on{background:var(--rose)}
#msg{flex:none;font-weight:600}

/* ---------- état vide / chargement ---------- */
#empty{
  position:absolute;inset:0;display:none;place-items:center;text-align:center;
  padding:2rem;font-size:1.1rem;color:var(--mute);
}
#empty.show{display:grid}
#empty b{display:block;color:var(--ink);font-size:1.6rem;margin-bottom:.5rem}
#wrapmain{flex:1;min-height:0;display:flex;position:relative}
#wrapmain main{flex:1}
@media (max-width:700px){
  .brand i{display:none}
  .chips{display:none}
}

/* ---------- visuels Instagram (moteur du Studio TrouveTonMatos) ---------- */
.mk{position:absolute;right:.5rem;bottom:.5rem;z-index:3;border:0;border-radius:999px;padding:.32rem .7rem;
  background:#000c;color:#fff;font:700 .78rem/1 inherit;cursor:pointer;display:flex;align-items:center;gap:.3rem;
  opacity:0;transform:translateY(.2rem);transition:opacity .2s,transform .2s;backdrop-filter:blur(4px)}
.card:hover .mk,.card:focus-within .mk{opacity:1;transform:none}
body.idle .mk{opacity:0!important}
@media (hover:none){.mk{opacity:.95;transform:none}}
.mk:hover{background:var(--rose)}
#mkdlg{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:18px;padding:0;
  width:min(1100px,96vw);max-height:94vh;font-size:15px;box-shadow:0 30px 90px #000b}
#mkdlg::backdrop{background:#000a;backdrop-filter:blur(3px)}
#mkdlg .hd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800}
#mkdlg .hd .x{margin-left:auto;border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer}
#mkdlg[open]{display:flex;flex-direction:column}
#mkdlg .bd{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;padding:16px 18px;overflow:auto;flex:1;min-height:0}
#mkdlg .hd,#mkdlg .ft{flex:none}
#mkdlg .pv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
#mkdlg .pv canvas{border-radius:12px;background:#000;width:100%;height:auto;display:block}
#mkdlg .ph2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#mkdlg .ph2 label{position:relative;cursor:pointer}
#mkdlg .ph2 img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid transparent;display:block;opacity:.55}
#mkdlg .ph2 input{position:absolute;opacity:0}
#mkdlg .ph2 input:checked+img{border-color:var(--rose);opacity:1}
#mkdlg .ph2 .bad img{filter:grayscale(1);opacity:.25}
#mkdlg form{display:grid;gap:12px;align-content:start}
#mkdlg label.f{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--mute)}
#mkdlg input[type=text],#mkdlg input[type=number],#mkdlg select{background:var(--surf2);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);font:inherit;font-size:15px;padding:9px 11px;width:100%;min-width:0}
#mkdlg input:focus,#mkdlg select:focus{outline:0;border-color:var(--rose)}
#mkdlg .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#mkdlg .seg{display:flex;gap:6px;flex-wrap:wrap}
#mkdlg .seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
#mkdlg .seg input{accent-color:var(--rose)}
#mkdlg .sale{background:var(--surf2);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline}
#mkdlg .sale b{font-size:22px}
#mkdlg .sale small{color:var(--mute);font-size:12px}
#mkdlg .ft{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
#mkdlg .ft .msg{color:var(--mute);font-size:13px;margin-right:auto}
#mkdlg .go{border:0;border-radius:12px;padding:11px 18px;font:700 15px inherit;cursor:pointer;background:var(--rose);color:#fff}
#mkdlg .go.alt{background:var(--surf2);color:var(--ink);border:1px solid var(--line)}
#mkdlg .go:disabled{opacity:.5;cursor:default}
#mkdlg a.lnk{color:var(--mute);font-size:13px}
@media (max-width:800px){#mkdlg .bd{grid-template-columns:1fr}#mkdlg a.lnk{display:none}#mkdlg .ft .msg{flex-basis:100%}#mkdlg .go{flex:1}}
</style>
</head>
<body>
<div id="bar"></div>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ff385c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14.5 4h-5L8 6.5H4.5A1.5 1.5 0 0 0 3 8v10a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18V8a1.5 1.5 0 0 0-1.5-1.5H16z"/>
      <circle cx="12" cy="13" r="3.4"/>
    </svg>
    Veille matos <i id="sub">dernières annonces détectées</i>
  </div>

  <div class="spacer"></div>

  <div class="chips">
    <span class="chip hot" id="c24">24 h <b>–</b></span>
    <span class="chip" id="c7j">7 j <b>–</b></span>
    <span class="chip" id="cbaisse">baisses <b>–</b></span>
    <span class="chip" id="ctot">au total <b>–</b></span>
  </div>

  <div class="live">
    <span class="dot" id="dot"></span>
    <span><b id="ago">connexion…</b><br><span id="gen">&nbsp;</span></span>
  </div>

  <button class="iconbtn" id="sound" title="Signal sonore à chaque nouvelle annonce (S)">🔕</button>
  <button class="iconbtn" id="theme" title="Thème clair / sombre (T)">◐</button>
  <button class="iconbtn" id="full" title="Plein écran (F)">⛶</button>
</header>

<div id="wrapmain">
  <main id="grid"></main>
  <div id="empty"><div><b>En attente de données</b><span id="emptysub">Lecture de data.json…</span></div></div>
</div>

<footer>
  <div id="srcs"></div>
  <div id="msg"></div>
  <div id="pager"></div>
</footer>


<dialog id="mkdlg" aria-labelledby="mkTitle">
  <div class="hd"><span id="mkTitle">📸 Visuels Instagram</span><span id="mkSrc" style="color:var(--mute);font-weight:600;font-size:13px"></span><button class="x" id="mkClose" aria-label="Fermer">✕</button></div>
  <div class="bd">
    <div>
      <div class="pv"><canvas id="pvStory" aria-label="Aperçu story"></canvas><canvas id="pvPost" aria-label="Aperçu post"></canvas></div>
      <div class="ph2" id="mkPhotos"></div>
    </div>
    <form id="mkForm" autocomplete="off">
      <label class="f">Titre<input type="text" name="title" maxlength="90"></label>
      <div class="row">
        <label class="f">Prix d'achat HT (€)<input type="number" name="buy" min="0" step="1" inputmode="decimal"></label>
        <label class="f">Marge HT (€)<input type="number" name="margin" min="0" step="10" inputmode="decimal"></label>
      </div>
      <div class="row">
        <label class="f">Arrondi du prix<select name="round"><option value="1">à l'euro</option><option value="10">à 10 €</option><option value="50">à 50 €</option><option value="100">à 100 €</option></select></label>
        <label class="f">Prix de vente affiché (HT)<input type="number" name="sale" min="0" step="1" inputmode="decimal" placeholder="calculé"></label>
      </div>
      <div class="sale"><span>Sur le visuel</span><span><b id="mkSale">—</b> <small id="mkMarge"></small></span></div>
      <div class="f"><span style="font-size:12px;font-weight:700;color:var(--mute)">Formats</span>
        <div class="seg"><label><input type="checkbox" name="story" checked> Story 9:16</label><label><input type="checkbox" name="post" checked> Post carré</label></div></div>
      <div class="row">
        <label class="f">Résolution<select name="scale"><option value="2">Haute — 2160 px</option><option value="1">Standard — 1080 px</option></select></label>
        <label class="f">Cadrage<select name="mode"><option value="cover">Remplir le cadre</option><option value="contain">Photo entière</option></select></label>
      </div>
      <label class="f">Zoom <input type="range" name="zoom" min="1" max="2.5" step="0.05" value="1"></label>
    </form>
  </div>
  <div class="ft">
    <span class="msg" id="mkMsg"></span>
    <a class="lnk" href="https://trouvetonmatos-studio.vercel.app/studio/" target="_blank" rel="noopener">Ouvrir le Studio complet ↗</a>
    <button class="go alt" id="mkShare" hidden>Partager</button>
    <button class="go" id="mkGo">Télécharger les PNG</button>
  </div>
</dialog>
<script>
'use strict';
/* ------------------------------------------------------------------ réglages */
const CFG = {
  // data.json publié par le watcher ; essayé en relatif d'abord (si la page est
  // servie à côté), sinon en absolu (fichier local, autre hébergement).
  urls: ['data.json', 'https://noecornagon-blip.github.io/puhlmann-watcher/data.json'],
  refreshMs: 60 * 1000,    // vérification toutes les minutes
  pageMs:    15 * 1000,    // rotation des pages
  freshMs:   24 * 3600e3,  // badge « nouveau »
  windowMs:  7 * 864e5,    // on montre TOUT ce qui est arrivé sur cette fenêtre
  minPages:  2,            // ...sans jamais descendre sous 2 écrans
  maxPages:  8,            // ...ni dépasser 8 écrans (garde-fou si une source déverse tout d'un coup)
};

// Nombre d'annonces à afficher : tout ce qui est arrivé dans la fenêtre,
// complété si la semaine a été calme, borné si elle a été exceptionnelle.
function feedSize() {
  const cut = Date.now() - CFG.windowMs;
  const inWindow = feed.filter((i) => i._t >= cut).length;
  return Math.min(feed.length, CFG.maxPages * cap, Math.max(inWindow, CFG.minPages * cap));
}

const SITE_COLORS = {
  puhlmann:'#2f6fed', alangordon:'#d9480f', awgear:'#2b9a66', newlifecine:'#9c36b5',
  newprovideo:'#e8590c', cinelenses:'#0c8599', broadcastsolutions:'#c2255c', cinemacameras:'#5c6470',
};
const GROUP_ICON = {
  cameras:'🎥', lenses:'🔭', monitors:'🖥️', lights:'💡',
  support:'🏗️', audio:'🎙️', accessories:'🔋', other:'📦',
};

/* ------------------------------------------------------------------ utilitaires */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 90) return s + ' s';
  const m = Math.round(s / 60);
  if (m < 90) return m + ' min';
  const h = Math.round(m / 60);
  if (h < 36) return h + ' h';
  return Math.round(h / 24) + ' j';
}

/* ------------------------------------------------------------------ état */
let DATA = null;          // dernier data.json lu
let feed = [];            // annonces datées, plus récentes d'abord
let known = null;         // clés déjà vues (null = premier chargement)
let justKeys = new Set(); // nouveautés du dernier rafraîchissement
let page = 0, cap = 8, cols = 4;
let lastOk = 0, lastTry = 0, nextAt = Date.now() + CFG.refreshMs;
let dataUrl = null;
let soundOn = store.get('mur-sound', false);

/* ------------------------------------------------------------------ lecture des données */
async function load() {
  lastTry = Date.now();
  const tries = dataUrl ? [dataUrl] : CFG.urls;
  let err;
  for (const u of tries) {
    try {
      // 'no-cache' force la revalidation mais autorise un 304 : une lecture
      // sans changement ne retélécharge donc rien.
      const r = await fetch(u, { cache:'no-cache', signal: AbortSignal.timeout(25000) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (!d || !Array.isArray(d.items)) throw new Error('format inattendu');
      dataUrl = u;
      return d;
    } catch (e) { err = e; }
  }
  throw err || new Error('indisponible');
}

function ingest(d) {
  DATA = d;
  const fresh = [];
  for (const it of d.items) {
    const arrivee = +new Date(it.firstSeen || it.added || 0) || 0;
    // une baisse de prix est un événement au même titre qu'une arrivée : une pièce
    // déjà repérée qui perd 20 % mérite l'écran autant qu'une annonce neuve.
    const baisse = it.priceDrop > 0 ? (+new Date(it.priceChangedAt || 0) || 0) : 0;
    const t = Math.max(arrivee, baisse);
    if (!t || t > Date.now() + 36e5) continue; // ni date d'arrivée ni baisse datée, ou date aberrante
    fresh.push({ ...it, _t: t, _baisse: baisse > 0 && baisse >= arrivee });
  }
  fresh.sort((a, b) => b._t - a._t);
  feed = fresh;

  // nouveautés depuis la lecture précédente
  const keys = new Set(feed.map((i) => i.key));
  if (known) {
    justKeys = new Set([...keys].filter((k) => !known.has(k)));
  } else {
    justKeys = new Set();                     // au premier chargement, rien ne « clignote »
  }
  known = keys;
  lastOk = Date.now();
  return justKeys.size;
}

/* ------------------------------------------------------------------ mise en page */
function measure() {
  const main = $('#grid');
  const u = parseFloat(getComputedStyle(document.documentElement).fontSize) || 18;
  const gap = parseFloat(getComputedStyle(main).gap) || 16;
  const w = main.clientWidth, h = main.clientHeight;
  cols = Math.max(1, Math.min(6, Math.floor((w + gap) / (21 * u + gap))));
  const rows = Math.max(1, Math.min(4, Math.floor((h + gap) / (19 * u + gap))));
  cap = Math.max(1, cols * rows);
  main.style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`;
  main.style.gridTemplateRows = `repeat(${rows},minmax(0,1fr))`;
}

function card(it) {
  const col = SITE_COLORS[it.site] || '#555';
  const dt = Date.now() - it._t;
  const shot = it.photos && it.photos[0]
    ? `<img src="${esc(it.photos[0])}" alt="" loading="lazy" referrerpolicy="no-referrer"
          onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${GROUP_ICON[it.group] || '📦'}'}))">`
    : `<div class="ph">${GROUP_ICON[it.group] || '📦'}</div>`;
  const ancien = it._baisse && it.priceHighEUR ? `<s>${eur.format(it.priceHighEUR)}</s>` : '';
  const price = it.priceEUR == null
    ? `<span class="price ask">Prix sur demande</span>`
    : `<span class="price">${ancien}${eur.format(it.priceEUR)}${it.currency === 'USD' ? ' <small>converti</small>' : ' <small>HT</small>'}</span>`;
  const etiquette = it._baisse
    ? `<span class="drop">− ${it.priceDrop} %</span>`
    : (dt < CFG.freshMs ? '<span class="new">nouveau</span>' : '');
  return `<a class="card${justKeys.has(it.key) ? ' just' : ''}${it._baisse ? ' baisse' : ''}" href="${esc(it.url)}" target="_blank" rel="noreferrer">
    <div class="shot">${shot}
      <div class="tags">
        <span class="site" style="background:${col}">${esc(it.siteName || it.site)}</span>
        ${etiquette}
      </div>
      ${it.photos && it.photos.length ? `<span class="mk" role="button" tabindex="0" data-mk="${esc(it.key)}" title="Créer la story et le post pour Instagram">📸 Story / post</span>` : ''}
    </div>
    <div class="body">
      <div class="title">${esc(it.title)}</div>
      <div class="meta">${price}<span class="when${dt < CFG.freshMs ? ' fresh' : ''}">il y a ${ago(dt)}</span></div>
    </div>
  </a>`;
}

function render() {
  measure();
  const shown = feed.slice(0, feedSize());
  const pages = Math.max(1, Math.ceil(shown.length / cap));
  if (page >= pages) page = 0;

  $('#grid').innerHTML = shown.slice(page * cap, page * cap + cap).map(card).join('');
  $('#empty').classList.toggle('show', !shown.length);

  $('#pager').innerHTML = pages > 1
    ? Array.from({ length: pages }, (_, i) => `<b class="${i === page ? 'on' : ''}"></b>`).join('')
    : '';

  renderMeta();
}

function renderMeta() {
  const n24 = feed.filter((i) => Date.now() - i._t < 864e5).length;
  const n7 = feed.filter((i) => Date.now() - i._t < 7 * 864e5).length;
  $('#c24').innerHTML = `24 h <b>${n24}</b>`;
  $('#c7j').innerHTML = `7 j <b>${n7}</b>`;
  const nb = feed.filter((i) => i._baisse).length;
  $('#cbaisse').innerHTML = `baisses <b>${nb}</b>`;
  $('#cbaisse').classList.toggle('hot', nb > 0);
  $('#ctot').innerHTML = `au total <b>${(DATA?.items.length || 0).toLocaleString('fr-FR')}</b>`;
  $('#c24').classList.toggle('hot', n24 > 0);
  const n = feedSize();
  $('#sub').textContent = n7 >= n
    ? `les ${n} plus récentes`
    : `tout ce qui est arrivé depuis 7 jours · ${n} annonces`;

  $('#srcs').innerHTML = (DATA?.sources || []).map((s) => {
    const cls = !s.ok ? 'down' : (s.stale ? 'stale' : '');
    return `<span><i class="${cls}"></i>${esc(s.name)}${s.count != null ? ' ' + s.count : ''}</span>`;
  }).join('');
}

function renderClock() {
  const offline = lastOk && lastTry > lastOk + 5000 && Date.now() - lastOk > CFG.refreshMs * 2;
  $('#dot').classList.toggle('bad', !!offline);
  if (!lastOk) {
    $('#ago').textContent = 'connexion…';
    $('#gen').textContent = '';
  } else if (offline) {
    $('#ago').textContent = 'hors ligne';
    $('#gen').textContent = `données d'il y a ${ago(Date.now() - lastOk)}`;
  } else {
    $('#ago').textContent = 'vérifié il y a ' + ago(Date.now() - lastOk);
    const g = DATA?.generatedAt ? new Date(DATA.generatedAt) : null;
    $('#gen').textContent = g
      ? `relevé des sites : ${g.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })}`
      : '';
  }
  const left = Math.max(0, nextAt - Date.now());
  $('#bar').style.width = (100 - (left / CFG.refreshMs) * 100).toFixed(1) + '%';
  // les durées relatives des cartes vieillissent sans tout redessiner
  document.querySelectorAll('.card .when').forEach((el, i) => {
    const it = feed[page * cap + i];
    if (it) el.textContent = 'il y a ' + ago(Date.now() - it._t);
  });
}

/* ------------------------------------------------------------------ son */
let actx;
function ding() {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    [0, .18].forEach((d, k) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + d;
      o.type = 'sine'; o.frequency.value = k ? 1046 : 784;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.14, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + .5);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .55);
    });
  } catch {}
}

/* ------------------------------------------------------------------ boucles */
async function refresh() {
  try {
    const d = await load();
    const same = !!DATA && d.generatedAt === DATA.generatedAt;
    const n = ingest(d);
    if (n > 0) { page = 0; ding(); flash(`${n} nouvelle${n > 1 ? 's' : ''} annonce${n > 1 ? 's' : ''}`); }
    // redessiner la grille seulement si le contenu a bougé : sans cela l'écran
    // rejouerait l'animation des cartes toutes les minutes.
    if (same && !n) renderMeta(); else render();
    $('#emptysub').textContent = 'Aucune annonce datée pour l’instant.';
  } catch (e) {
    $('#emptysub').textContent = 'Lecture impossible : ' + (e.message || e);
  } finally {
    nextAt = Date.now() + CFG.refreshMs;
    renderClock();
  }
}

let flashT;
function flash(txt) {
  const el = $('#msg');
  el.textContent = '● ' + txt;
  el.style.color = 'var(--rose)';
  clearTimeout(flashT);
  flashT = setTimeout(() => { el.textContent = ''; }, 90 * 1000);
}

function turnPage() {
  if ($('#mkdlg')?.open) return;   // pas de rotation pendant la création d'un visuel
  const pages = Math.max(1, Math.ceil(feedSize() / cap));
  if (pages < 2) return;
  page = (page + 1) % pages;
  render();
}

/* ------------------------------------------------------------------ contrôles */
$('#sound').textContent = soundOn ? '🔔' : '🔕';
$('#sound').classList.toggle('on', soundOn);
$('#sound').onclick = () => {
  soundOn = !soundOn; store.set('mur-sound', soundOn);
  $('#sound').textContent = soundOn ? '🔔' : '🔕';
  $('#sound').classList.toggle('on', soundOn);
  if (soundOn) ding();
};
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('mur-theme', next);
};
const savedTheme = store.get('mur-theme', null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};
addEventListener('keydown', (e) => {
  if ($('#mkdlg').open || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'f') $('#full').click();
  else if (k === 'r') refresh();
  else if (k === 's') $('#sound').click();
  else if (k === 't') $('#theme').click();
  else if (k === 'arrowright' || k === ' ') { e.preventDefault(); turnPage(); }
  else if (k === 'arrowleft') {
    const pages = Math.max(1, Math.ceil(feedSize() / cap));
    page = (page - 1 + pages) % pages; render();
  }
});
// le curseur est masqué pour un écran mural, et réapparaît si on bouge la souris
let curT = setTimeout(() => document.body.classList.add('idle'), 5000);
addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(curT);
  curT = setTimeout(() => document.body.classList.add('idle'), 5000);
});
addEventListener('resize', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });


/* ------------------------------------------------------------------ visuels Instagram
   Utilise le moteur de rendu du Studio TrouveTonMatos (render-core.js + modèle de story),
   chargé à la première utilisation : les visuels sont identiques à ceux du Studio.
   Les photos sont chargées en CORS ; les sites qui ne l'autorisent pas passent par le
   relais d'images public wsrv.nl, faute de quoi le navigateur interdirait l'export PNG. */
const STUDIO = 'https://trouvetonmatos-studio.vercel.app/studio/';
const MK = { engine: null, item: null, photos: [], busy: false, preview: null };
const loadScript = (src) => new Promise((ok, ko) => {
  const s = document.createElement('script'); s.src = src; s.onload = ok;
  s.onerror = () => ko(new Error('Studio injoignable (' + src.split('/').pop() + ')'));
  document.head.appendChild(s);
});
const newCanvas = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
function loadEngine() {
  if (!MK.engine) MK.engine = (async () => {
    if (!window.TTMRender) await loadScript(STUDIO + 'render-core.js');
    if (!window.TTM_TEMPLATES?.story) await loadScript(STUDIO + 'assets/template-story.js');
    const R = window.TTMRender, T = R.TEMPLATES;
    const img = new Image(); img.src = window.TTM_TEMPLATES.story; await img.decode();
    T.story.image = img;
    if (T.story.autodetect) { const f = R.detectSlot(img, newCanvas); if (f) T.story.slot = f; }  // comme le Studio
    T.post.image = R.buildPostTemplate(img, newCanvas);
    return R;
  })().catch((e) => { MK.engine = null; throw e; });
  return MK.engine;
}
function loadPhoto(url) {
  const tryLoad = (src) => new Promise((ok, ko) => {
    const im = new Image(); im.crossOrigin = 'anonymous'; im.referrerPolicy = 'no-referrer';
    im.onload = () => ok(im); im.onerror = ko; im.src = src;
  });
  return tryLoad(url).catch(() => tryLoad('https://wsrv.nl/?url=' + encodeURIComponent(url)));
}
const slug = (t) => String(t || 'visuel').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'visuel';
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };

function salePrice() {
  const f = $('#mkForm');
  const manual = num(f.sale.value);
  if (manual != null && f.sale.dataset.touched === '1') return manual;
  const buy = num(f.buy.value), m = num(f.margin.value) || 0, r = Number(f.round.value) || 1;
  if (buy == null) return null;
  const raw = buy + m;   // marge HT en euros, ajoutée au prix d'achat HT
  return Math.ceil(raw / r) * r;
}
function selectedPhotos() { return MK.photos.filter((p) => p.ok && p.checked); }

function drawPreview() {
  const R = window.TTMRender; if (!R || !MK.item) return;
  const f = $('#mkForm'), sale = salePrice(), buy = num(f.buy.value);
  $('#mkSale').textContent = sale == null ? 'saisissez le prix d’achat' : R.formatPrice(String(sale)) + ' HT';
  $('#mkMarge').textContent = sale != null && buy != null ? `dont marge ${R.formatPrice(String(Math.round(sale - buy)))}` : '';
  if (f.sale.dataset.touched !== '1') f.sale.placeholder = sale == null ? 'calculé' : String(sale);
  const p = (MK.preview != null && MK.photos[MK.preview]?.ok && MK.photos[MK.preview].checked ? MK.photos[MK.preview] : null) || selectedPhotos()[0];
  for (const key of ['story', 'post']) {
    const cv = $(key === 'story' ? '#pvStory' : '#pvPost'), T = R.TEMPLATES[key], k = .5;
    cv.width = T.w * k; cv.height = T.h * k; cv.style.display = f[key].checked ? '' : 'none';
    R.compose(cv.getContext('2d'), { template: T.image, geom: T, scale: k, placeholder: !p,
      photo: p ? { source: p.img, naturalWidth: p.img.naturalWidth, naturalHeight: p.img.naturalHeight, zoom: Number(f.zoom.value), dx: 0, dy: 0, mode: f.mode.value, bg: '#000' } : null,
      text: { title: f.title.value, price: sale == null ? '' : String(sale), tax: 'HT' } });
  }
  const n = selectedPhotos().length * ((f.story.checked ? 1 : 0) + (f.post.checked ? 1 : 0));
  $('#mkGo').textContent = n ? `Télécharger ${n} PNG` : 'Télécharger les PNG';
  $('#mkGo').disabled = !n || sale == null || MK.busy;
  $('#mkShare').disabled = $('#mkGo').disabled;
}

async function renderAll() {
  const R = await loadEngine(), f = $('#mkForm'), sale = salePrice(), k = Number(f.scale.value);
  const out = [], base = slug(f.title.value);
  const photos = selectedPhotos();
  for (const [i, p] of photos.entries()) for (const key of ['story', 'post']) {
    if (!f[key].checked) continue;
    const T = R.TEMPLATES[key], cv = newCanvas(T.w * k, T.h * k);
    R.compose(cv.getContext('2d'), { template: T.image, geom: T, scale: k,
      photo: { source: p.img, naturalWidth: p.img.naturalWidth, naturalHeight: p.img.naturalHeight, zoom: Number(f.zoom.value), dx: 0, dy: 0, mode: f.mode.value, bg: '#000' },
      text: { title: f.title.value, price: String(sale), tax: 'HT' } });
    const blob = await new Promise((ok) => cv.toBlob(ok, 'image/png'));
    out.push(new File([blob], `${base}-${key}${photos.length > 1 ? '-' + (i + 1) : ''}.png`, { type: 'image/png' }));
  }
  return out;
}

async function openMaker(key) {
  const it = feed.find((x) => x.key === key) || (DATA?.items || []).find((x) => x.key === key);
  if (!it) return;
  MK.item = it; MK.photos = []; MK.preview = null;
  const f = $('#mkForm'), saved = store.get('mur-marge-eur', { margin: 500, round: 10, scale: 2, mode: 'cover' });
  f.title.value = it.title || '';
  f.buy.value = it.priceEUR != null ? Math.round(it.priceEUR) : '';
  f.margin.value = saved.margin; f.round.value = saved.round; f.scale.value = saved.scale; f.mode.value = saved.mode;
  f.zoom.value = 1; f.sale.value = ''; f.sale.dataset.touched = '';
  $('#mkSrc').textContent = `${it.siteName || it.site}${it.currency === 'USD' ? ' · prix converti en €' : ''}`;
  $('#mkMsg').textContent = 'Chargement du Studio et des photos…';
  $('#mkPhotos').innerHTML = '';
  $('#mkShare').hidden = !(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] }));
  $('#mkdlg').showModal();
  try { await loadEngine(); } catch (e) { $('#mkMsg').textContent = e.message; return; }
  // toutes les photos de l'annonce sont exportées par défaut (décochez celles à écarter)
  const list = [...new Set(it.photos || [])].slice(0, 30);
  $('#mkPhotos').innerHTML = list.map((u, i) => `<label data-i="${i}" title="Photo ${i + 1}"><input type="checkbox" checked><img src="${esc(u)}" alt="" referrerpolicy="no-referrer"></label>`).join('');
  MK.photos = list.map((u) => ({ url: u, ok: false, checked: true, img: null }));
  await Promise.all(MK.photos.map(async (p, i) => {
    try { p.img = await loadPhoto(p.url); p.ok = true; }
    catch { p.ok = false; const l = document.querySelector(`#mkPhotos [data-i="${i}"]`); l?.classList.add('bad'); if (l) l.querySelector('input').checked = false; }
  }));
  if (MK.item !== it) return;
  const bad = MK.photos.filter((p) => !p.ok).length;
  const okN = MK.photos.filter((p) => p.ok).length;
  $('#mkMsg').textContent = `${okN} photo${okN > 1 ? 's' : ''} prête${okN > 1 ? 's' : ''}${bad ? ` · ${bad} inaccessible${bad > 1 ? 's' : ''} (grisée${bad > 1 ? 's' : ''})` : ''}. Décochez celles à écarter.`;
  drawPreview();
}

$('#grid').addEventListener('click', (e) => {
  const b = e.target.closest('[data-mk]'); if (!b) return;
  e.preventDefault(); e.stopPropagation(); openMaker(b.dataset.mk);
});
$('#grid').addEventListener('keydown', (e) => {
  const b = e.target.closest('[data-mk]'); if (!b || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault(); openMaker(b.dataset.mk);
});
$('#mkPhotos').addEventListener('change', (e) => {
  const l = e.target.closest('label'); if (!l) return;
  const p = MK.photos[Number(l.dataset.i)]; if (p) p.checked = e.target.checked;
  MK.preview = e.target.checked ? Number(l.dataset.i) : null; drawPreview();
});
$('#mkForm').addEventListener('input', (e) => {
  if (e.target.name === 'sale') e.target.dataset.touched = e.target.value ? '1' : '';
  const f = $('#mkForm');
  store.set('mur-marge-eur', { margin: num(f.margin.value) || 0, round: Number(f.round.value), scale: Number(f.scale.value), mode: f.mode.value });
  drawPreview();
});
$('#mkForm').addEventListener('submit', (e) => e.preventDefault());
$('#mkClose').onclick = () => $('#mkdlg').close();
$('#mkdlg').addEventListener('close', () => { MK.item = null; });

async function exportPngs(share) {
  MK.busy = true; drawPreview(); $('#mkMsg').textContent = 'Création des images…';
  try {
    const files = await renderAll();
    if (share) { await navigator.share({ files, title: $('#mkForm').title.value }); }
    else for (const file of files) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      await new Promise((ok) => setTimeout(ok, 350));   // laisse le navigateur enchaîner les téléchargements
    }
    $('#mkMsg').textContent = share ? 'Partagé.' : `✔ ${files.length} PNG téléchargé(s) (${$('#mkForm').scale.value === '2' ? '2160' : '1080'} px de large).`;
  } catch (e) {
    $('#mkMsg').textContent = e.name === 'AbortError' ? 'Partage annulé.' : `Échec : ${e.message}`;
  } finally { MK.busy = false; drawPreview(); }
}
$('#mkGo').onclick = () => exportPngs(false);
$('#mkShare').onclick = () => exportPngs(true);

/* ------------------------------------------------------------------ démarrage */
render();
refresh();
setInterval(refresh, CFG.refreshMs);
setInterval(turnPage, CFG.pageMs);
setInterval(renderClock, 500);
</script>
</body>
</html>
