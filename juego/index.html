<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Come Monstruos</title>
<style>
  :root {
    --bg: #fdf6e9;
    --bg2: #f3e3c6;
    --ink: #2b1d14;
    --accent: #e2553b;
    --accent2: #2f8f5b;
    --panel: rgba(255, 252, 245, 0.92);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1622; --bg2: #2a2133; --ink: #f6ece0; --accent: #ff7a5c; --accent2: #5fd394;
      --panel: rgba(36, 28, 44, 0.92);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1622; --bg2: #2a2133; --ink: #f6ece0; --accent: #ff7a5c; --accent2: #5fd394;
    --panel: rgba(36, 28, 44, 0.92);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  #hud {
    position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between;
    align-items: center; pointer-events: none; font-weight: 800; font-size: 20px;
  }
  #hud .pill { background: var(--panel); padding: 6px 14px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #card {
    background: var(--panel); border-radius: 24px; padding: 28px 24px; max-width: 420px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.2);
  }
  #card h1 { margin: 0 0 6px; font-size: 34px; line-height: 1.1; }
  #card p { margin: 8px 0; font-size: 16px; line-height: 1.4; }
  #card img { width: 110px; animation: bob 1.2s ease-in-out infinite; }
  .legend { display: flex; gap: 16px; justify-content: center; margin: 12px 0; font-size: 14px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
  button {
    margin-top: 12px; font: inherit; font-weight: 800; font-size: 20px; border: 0; border-radius: 999px;
    padding: 12px 30px; background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .hidden { display: none !important; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div class="pill" id="score">🍴 0</div>
  <div class="pill" id="level">Nivel 1</div>
  <div class="pill" id="lives">❤️❤️❤️</div>
</div>
<div id="overlay">
  <div id="card">
    <img src="cara.webp" alt="">
    <h1 id="title">¡Come Monstruos!</h1>
    <p id="msg">Mueve la cara con el ratón, el dedo o las flechas y zámpate a los monstruitos con la boca.</p>
    <div class="legend" id="legend">
      <span><i class="dot" style="background:#7bd389"></i>+1</span>
      <span><i class="dot" style="background:#ffc83d"></i>+5 dorado</span>
      <span><i class="dot" style="background:#8b5cf6"></i>¡pica! −❤️</span>
    </div>
    <button id="play">Jugar</button>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const face = new Image();
  face.src = 'cara.webp';
  // face image is 289x420; mouth centre at (150, 355)
  const FACE_W = 289, FACE_H = 420, MOUTH_X = 150 / FACE_W - 0.5, MOUTH_Y = 355 / FACE_H - 0.5;

  let W, H, DPR, scale;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    scale = Math.min(W, H) / 700;
  }
  addEventListener('resize', resize); resize();

  // ---------- audio ----------
  let ac;
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), ac.currentTime + dur);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    chomp: () => { beep(220, 0.08, 'square', 0.07, -120); setTimeout(() => beep(160, 0.06, 'square', 0.05, -60), 60); },
    gold: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.1, 'triangle', 0.07), i * 60)),
    ouch: () => beep(300, 0.35, 'sawtooth', 0.08, -240),
    level: () => [392, 523, 659].forEach((f, i) => setTimeout(() => beep(f, 0.14, 'triangle', 0.07), i * 90)),
    over: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.08), i * 160)),
  };

  // ---------- input ----------
  const target = { x: W / 2, y: H / 2 };
  const keys = {};
  let usingKeys = false;
  function pointer(e) {
    const p = e.touches ? e.touches[0] : e;
    if (!p) return;
    // on touch, aim the mouth slightly above the finger so the finger doesn't cover it
    const off = e.touches ? 90 * scale : 0;
    target.x = p.clientX; target.y = p.clientY - off; usingKeys = false;
  }
  addEventListener('mousemove', pointer);
  addEventListener('touchstart', pointer, { passive: true });
  addEventListener('touchmove', e => { pointer(e); e.preventDefault(); }, { passive: false });
  addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.startsWith('Arrow')) e.preventDefault();
    if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') start();
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // ---------- game state ----------
  let state = 'menu', score, lives, level, eatenThisLevel, monsters, particles, popups, t, spawnTimer, hurtTimer, shake;
  const player = { x: W / 2, y: H / 2, vx: 0, vy: 0, chomp: 0, tilt: 0, grow: 1 };
  let best = 0;
  try { best = +localStorage.getItem('comeMonstruosBest') || 0; } catch (e) {}

  const PALETTES = [
    ['#7bd389', '#4caf6a'], ['#5ec8f2', '#2d97c4'], ['#ff8fb3', '#e2588a'],
    ['#ffa552', '#e07b1f'], ['#a3e0d8', '#5fb3a7'],
  ];

  function faceH() { return 220 * scale * player.grow; }
  function mouth() {
    const h = faceH(), w = h * FACE_W / FACE_H;
    const c = Math.cos(player.tilt), s = Math.sin(player.tilt);
    const mx = MOUTH_X * w, my = MOUTH_Y * h;
    return { x: player.x + mx * c - my * s, y: player.y + mx * s + my * c, r: h * 0.12 };
  }

  function start() {
    score = 0; lives = 3; level = 1; eatenThisLevel = 0; monsters = []; particles = []; popups = [];
    t = 0; spawnTimer = 0; hurtTimer = 0; shake = 0;
    player.x = W / 2; player.y = H / 2; player.grow = 1; player.chomp = 0;
    target.x = W / 2; target.y = H / 2;
    for (let i = 0; i < 5; i++) spawn(true);
    state = 'play';
    $('overlay').classList.add('hidden'); $('hud').classList.remove('hidden');
    updateHud();
  }

  function spawn(anywhere) {
    const r = (14 + Math.random() * 12) * scale;
    let x, y;
    if (anywhere) {
      do { x = Math.random() * W; y = Math.random() * H; } while (Math.hypot(x - player.x, y - player.y) < 220 * scale);
    } else {
      const side = Math.floor(Math.random() * 4);
      x = side === 0 ? -r : side === 1 ? W + r : Math.random() * W;
      y = side === 2 ? -r : side === 3 ? H + r : Math.random() * H;
    }
    const roll = Math.random();
    const spicyChance = Math.min(0.08 + level * 0.035, 0.32);
    const kind = roll < 0.06 ? 'gold' : roll < 0.06 + spicyChance ? 'spicy' : 'normal';
    const speed = (40 + level * 9 + Math.random() * 30) * scale * (kind === 'gold' ? 1.6 : 1);
    const a = Math.atan2(H / 2 - y, W / 2 - x) + (Math.random() - 0.5) * 1.6;
    monsters.push({
      x, y, r, kind, speed, dir: a, wob: Math.random() * 10, eyes: 1 + Math.floor(Math.random() * 3),
      pal: kind === 'gold' ? ['#ffd54a', '#e0a400'] : kind === 'spicy' ? ['#9b6bff', '#6a3fd1'] : PALETTES[Math.floor(Math.random() * PALETTES.length)],
      horns: Math.random() < 0.5, blink: Math.random() * 4, life: kind === 'gold' ? 7 : Infinity, scared: 0,
    });
  }

  function burst(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (80 + Math.random() * 220) * scale;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.4, color, r: (3 + Math.random() * 4) * scale });
    }
  }
  function popup(x, y, text, color) { popups.push({ x, y, text, color, life: 1 }); }

  function updateHud() {
    $('score').textContent = '🍴 ' + score;
    $('level').textContent = 'Nivel ' + level;
    $('lives').textContent = lives > 0 ? '❤️'.repeat(lives) : '💀';
  }

  function gameOver() {
    state = 'over'; sfx.over();
    if (score > best) { best = score; try { localStorage.setItem('comeMonstruosBest', best); } catch (e) {} }
    $('title').textContent = '¡Qué empacho!';
    $('msg').innerHTML = `Te has comido <b>${score}</b> puntos de monstruos.<br>Récord: <b>${best}</b>`;
    $('legend').classList.add('hidden');
    $('play').textContent = 'Otra vez';
    setTimeout(() => { $('overlay').classList.remove('hidden'); $('hud').classList.add('hidden'); }, 900);
  }

  // ---------- update ----------
  function update(dt) {
    t += dt;
    // keyboard
    const kx = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
    const ky = (keys['arrowdown'] || keys['s'] ? 1 : 0) - (keys['arrowup'] || keys['w'] ? 1 : 0);
    if (kx || ky) {
      usingKeys = true;
      const m = mouth();
      const sp = 520 * scale * dt / Math.hypot(kx, ky);
      target.x = Math.max(0, Math.min(W, m.x + kx * sp * 8));
      target.y = Math.max(0, Math.min(H, m.y + ky * sp * 8));
    } else if (usingKeys) {
      const m = mouth(); target.x = m.x; target.y = m.y;
    }
    // move face so that its mouth goes toward the target
    const m0 = mouth();
    const dx = target.x - m0.x, dy = target.y - m0.y;
    const k = 1 - Math.pow(0.0008, dt);
    const prevX = player.x;
    player.x += dx * k; player.y += dy * k;
    player.vx = (player.x - prevX) / Math.max(dt, 1e-3);
    player.tilt += ((Math.max(-1, Math.min(1, player.vx / (900 * scale))) * 0.35) - player.tilt) * Math.min(1, dt * 8);
    player.chomp = Math.max(0, player.chomp - dt * 4);
    hurtTimer = Math.max(0, hurtTimer - dt);
    shake = Math.max(0, shake - dt * 30);

    // spawn
    spawnTimer -= dt;
    const maxMon = 6 + level * 2;
    if (spawnTimer <= 0 && monsters.length < maxMon) { spawn(false); spawnTimer = Math.max(0.25, 1.1 - level * 0.08); }

    const m = mouth();
    for (let i = monsters.length - 1; i >= 0; i--) {
      const mo = monsters[i];
      mo.wob += dt * 6; mo.blink -= dt; mo.life -= dt;
      if (mo.blink < -0.12) mo.blink = 2 + Math.random() * 4;
      // wander
      mo.dir += (Math.sin(mo.wob * 0.37) * 0.9 + (Math.random() - 0.5) * 2) * dt;
      // flee from mouth when close (smarter at higher levels), spicy ones chase a bit
      const fx = mo.x - m.x, fy = mo.y - m.y, fd = Math.hypot(fx, fy);
      const sense = (140 + level * 12) * scale;
      let sp = mo.speed;
      if (fd < sense) {
        const away = Math.atan2(fy, fx);
        const want = mo.kind === 'spicy' ? away + Math.PI : away;
        const turn = mo.kind === 'spicy' ? 0.8 : Math.min(3, 1 + level * 0.25);
        let diff = ((want - mo.dir + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        mo.dir += diff * Math.min(1, turn * dt);
        if (mo.kind !== 'spicy') { sp *= 1.5; mo.scared = 0.3; }
      }
      mo.scared = Math.max(0, mo.scared - dt);
      mo.x += Math.cos(mo.dir) * sp * dt; mo.y += Math.sin(mo.dir) * sp * dt;
      // stay on screen (bounce)
      const pad = mo.r;
      if (mo.x < pad && Math.cos(mo.dir) < 0) mo.dir = Math.PI - mo.dir;
      if (mo.x > W - pad && Math.cos(mo.dir) > 0) mo.dir = Math.PI - mo.dir;
      if (mo.y < pad && Math.sin(mo.dir) < 0) mo.dir = -mo.dir;
      if (mo.y > H - pad && Math.sin(mo.dir) > 0) mo.dir = -mo.dir;
      if (mo.life <= 0) { burst(mo.x, mo.y, '#ffd54a', 8); monsters.splice(i, 1); continue; }

      // eaten?
      if (fd < m.r + mo.r * 0.6) {
        monsters.splice(i, 1);
        player.chomp = 1;
        if (mo.kind === 'spicy') {
          if (hurtTimer <= 0) {
            lives--; hurtTimer = 1.2; shake = 14; sfx.ouch();
            popup(mo.x, mo.y, '¡PICA! 🌶️', '#8b5cf6'); burst(mo.x, mo.y, '#8b5cf6', 20);
            updateHud();
            if (lives <= 0) { gameOver(); return; }
          }
        } else {
          const pts = mo.kind === 'gold' ? 5 : 1;
          score += pts; eatenThisLevel += pts;
          (mo.kind === 'gold' ? sfx.gold : sfx.chomp)();
          popup(mo.x, mo.y - 10, '+' + pts, mo.kind === 'gold' ? '#e0a400' : mo.pal[1]);
          burst(mo.x, mo.y, mo.pal[0]);
          player.grow = Math.min(1.45, player.grow + 0.008);
          if (eatenThisLevel >= 8 + level * 2) {
            level++; eatenThisLevel = 0; sfx.level();
            popup(W / 2, H / 2, '¡Nivel ' + level + '!', getComputedStyle(document.documentElement).getPropertyValue('--accent'));
            if (lives < 5 && level % 3 === 0) { lives++; popup(W / 2, H / 2 + 50 * scale, '+❤️', '#e2553b'); }
          }
          updateHud();
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.vy += 300 * scale * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i]; p.life -= dt * 0.9; p.y -= 50 * scale * dt;
      if (p.life <= 0) popups.splice(i, 1);
    }
  }

  // ---------- draw ----------
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  let colors = {};
  function refreshColors() { colors = { bg: css('--bg'), bg2: css('--bg2'), ink: css('--ink') }; }
  refreshColors();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', refreshColors);

  function drawBackground() {
    ctx.fillStyle = colors.bg; ctx.fillRect(0, 0, W, H);
    // polka dots
    ctx.fillStyle = colors.bg2;
    const s = 60 * Math.max(scale, 0.6);
    const off = (t * 10) % s;
    for (let y = -s; y < H + s; y += s) for (let x = -s; x < W + s; x += s) {
      const ox = ((y / s) % 2) * s / 2;
      ctx.beginPath(); ctx.arc(x + ox + off, y + off, 5 * Math.max(scale, 0.6), 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawMonster(mo) {
    const { x, y, r } = mo;
    const sq = 1 + Math.sin(mo.wob * 2) * 0.08;
    ctx.save(); ctx.translate(x, y);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.9, r * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    // legs
    ctx.strokeStyle = mo.pal[1]; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i += 2) {
      const step = Math.sin(mo.wob * 2.5 + i) * r * 0.25;
      ctx.beginPath(); ctx.moveTo(i * r * 0.4, r * 0.5); ctx.lineTo(i * r * 0.5 + step, r * 0.95); ctx.stroke();
    }
    ctx.scale(1 / sq, sq);
    // horns / spikes
    ctx.fillStyle = mo.pal[1];
    if (mo.kind === 'spicy') {
      for (let i = 0; i < 9; i++) {
        const a = -Math.PI + (i / 8) * Math.PI;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - 0.2) * r * 0.9, Math.sin(a - 0.2) * r * 0.9);
        ctx.lineTo(Math.cos(a) * r * 1.45, Math.sin(a) * r * 1.45);
        ctx.lineTo(Math.cos(a + 0.2) * r * 0.9, Math.sin(a + 0.2) * r * 0.9);
        ctx.fill();
      }
    } else if (mo.horns) {
      for (let i = -1; i <= 1; i += 2) {
        ctx.beginPath(); ctx.moveTo(i * r * 0.3, -r * 0.8); ctx.lineTo(i * r * 0.65, -r * 1.45); ctx.lineTo(i * r * 0.7, -r * 0.6); ctx.fill();
      }
    } else {
      ctx.lineWidth = r * 0.1; ctx.strokeStyle = mo.pal[1];
      ctx.beginPath(); ctx.moveTo(0, -r * 0.9); ctx.quadraticCurveTo(r * 0.3, -r * 1.4, r * 0.1, -r * 1.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(r * 0.1, -r * 1.5, r * 0.14, 0, Math.PI * 2); ctx.fill();
    }
    // body
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
    g.addColorStop(0, mo.pal[0]); g.addColorStop(1, mo.pal[1]);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    if (mo.kind === 'gold') {
      ctx.strokeStyle = `rgba(255,255,255,${0.5 + Math.sin(t * 10) * 0.4})`; ctx.lineWidth = 3 * scale;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.25, 0, Math.PI * 2); ctx.stroke();
    }
    // eyes
    const m = mouth();
    const look = Math.atan2(m.y - y, m.x - x);
    const n = mo.eyes;
    const er = r * (n === 1 ? 0.42 : n === 2 ? 0.3 : 0.24);
    for (let i = 0; i < n; i++) {
      const ex = (n === 1 ? 0 : (i / (n - 1) - 0.5) * r * (n === 2 ? 0.8 : 1.1));
      const ey = -r * 0.2 - (n === 3 && i === 1 ? r * 0.2 : 0);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
      if (mo.blink < 0) {
        ctx.strokeStyle = '#222'; ctx.lineWidth = 2 * scale;
        ctx.beginPath(); ctx.moveTo(ex - er, ey); ctx.lineTo(ex + er, ey); ctx.stroke();
      } else {
        const pr = er * (mo.scared ? 0.35 : 0.5);
        ctx.fillStyle = '#1b1b1b';
        ctx.beginPath(); ctx.arc(ex + Math.cos(look) * er * 0.4, ey + Math.sin(look) * er * 0.4, pr, 0, Math.PI * 2); ctx.fill();
      }
    }
    // mouth
    ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2 * scale; ctx.fillStyle = '#5a1f2a';
    ctx.beginPath();
    if (mo.scared || mo.kind === 'spicy') {
      ctx.ellipse(0, r * 0.4, r * 0.25, r * (mo.kind === 'spicy' ? 0.12 : 0.2), 0, 0, Math.PI * 2); ctx.fill();
      if (mo.kind === 'spicy') { // fangs
        ctx.fillStyle = '#fff';
        for (let i = -1; i <= 1; i += 2) { ctx.beginPath(); ctx.moveTo(i * r * 0.15, r * 0.3); ctx.lineTo(i * r * 0.08, r * 0.5); ctx.lineTo(i * r * 0.02, r * 0.3); ctx.fill(); }
      }
    } else {
      ctx.arc(0, r * 0.3, r * 0.25, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    }
    ctx.restore();
  }

  function drawFace() {
    const h = faceH(), w = h * FACE_W / FACE_H;
    const c = player.chomp;
    // chomp: quick squash & stretch
    const sy = 1 - Math.sin(c * Math.PI) * 0.18, sx = 1 + Math.sin(c * Math.PI) * 0.12;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(0, h * 0.52, w * 0.4, h * 0.06, 0, 0, Math.PI * 2); ctx.fill();
    ctx.scale(sx, sy);
    if (hurtTimer > 0 && Math.floor(hurtTimer * 12) % 2 === 0) ctx.globalAlpha = 0.35;
    if (face.complete && face.naturalWidth) ctx.drawImage(face, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackground();
    if (state !== 'menu') {
      for (const mo of monsters) drawMonster(mo);
      drawFace();
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const p of popups) {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.font = `900 ${Math.round(30 * Math.max(scale, 0.7))}px ui-rounded, system-ui, sans-serif`;
        ctx.lineWidth = 5; ctx.strokeStyle = colors.bg; ctx.strokeText(p.text, p.x, p.y);
        ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;
    } else {
      // idle monsters wandering behind the menu
      for (const mo of menuMonsters) drawMonster(mo);
    }
    ctx.restore();
  }

  // a few monsters on the start screen
  const menuMonsters = [];
  function menuInit() {
    player.x = -9999; player.y = -9999;
    for (let i = 0; i < 8; i++) {
      menuMonsters.push({ x: Math.random() * W, y: Math.random() * H, r: (16 + Math.random() * 14) * scale, kind: i === 0 ? 'gold' : i < 3 ? 'spicy' : 'normal',
        speed: 30 * scale, dir: Math.random() * 7, wob: Math.random() * 10, eyes: 1 + (i % 3), horns: i % 2 === 0, blink: Math.random() * 3, scared: 0,
        pal: i === 0 ? ['#ffd54a', '#e0a400'] : i < 3 ? ['#9b6bff', '#6a3fd1'] : PALETTES[i % PALETTES.length] });
    }
  }
  menuInit();
  function updateMenu(dt) {
    t += dt;
    for (const mo of menuMonsters) {
      mo.wob += dt * 6; mo.blink -= dt; if (mo.blink < -0.12) mo.blink = 2 + Math.random() * 4;
      mo.dir += (Math.random() - 0.5) * 2 * dt;
      mo.x += Math.cos(mo.dir) * mo.speed * dt; mo.y += Math.sin(mo.dir) * mo.speed * dt;
      if (mo.x < mo.r || mo.x > W - mo.r) mo.dir = Math.PI - mo.dir;
      if (mo.y < mo.r || mo.y > H - mo.r) mo.dir = -mo.dir;
      mo.x = Math.max(mo.r, Math.min(W - mo.r, mo.x)); mo.y = Math.max(mo.r, Math.min(H - mo.r, mo.y));
    }
  }

  t = 0;
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'play') update(dt);
    else if (state === 'menu') updateMenu(dt);
    else { // game over: let particles settle
      t += dt;
      for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) particles.splice(i, 1); }
    }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  $('play').addEventListener('click', e => { e.stopPropagation(); start(); });
})();
</script>
</body>
</html>
