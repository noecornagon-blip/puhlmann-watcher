name: Actualiser le tableau de bord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scraper les sites et générer la page
        run: node dashboard.mjs --out site
        env:
          PREV_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Sauvegarder l'état (annonces déjà vues)
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add dashboard-state.json
          if ! git diff --cached --quiet; then
            git commit -m "maj état du tableau de bord"
            git pull --rebase
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
