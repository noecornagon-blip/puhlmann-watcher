name: Actualiser le tableau de bord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scraper les sites et générer la page
        run: node dashboard.mjs --out site
        env:
          PREV_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json

      - name: Ajouter l'écran mural
        run: cp mur.html maker.js site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Sauvegarder l'état (annonces déjà vues)
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add dashboard-state.json
          if ! git diff --cached --quiet; then
            git commit -m "maj état du tableau de bord"
            git pull --rebase
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------
  # Instagram, phase 2 (facultatif) : à chaque exécution, demande au site de
  # publier UNE publication en attente (cochée « Poster sur Instagram » lors
  # de la publication dans l'admin). Les posts sont ainsi étalés (~1 par
  # exécution). Inactif tant que le secret IG_CRON_SECRET n'existe pas ;
  # un échec n'interrompt jamais le tableau de bord ni la relance.
  # ------------------------------------------------------------------
  instagram:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Publier la prochaine publication Instagram en attente
        env:
          IG_CRON_SECRET: ${{ secrets.IG_CRON_SECRET }}
        run: |
          if [ -z "$IG_CRON_SECRET" ]; then
            echo "IG_CRON_SECRET absent : publication Instagram automatique inactive."
            exit 0
          fi
          code=$(curl -sS -o /tmp/rep -w '%{http_code}' --max-time 60 -X POST \
            -H "Authorization: Bearer $IG_CRON_SECRET" \
            -H "Content-Type: application/json" \
            "https://trouvetonmatos.fr/api/ig-publish-next" -d '{}') || true
          echo "Réponse HTTP $code :"; head -c 2000 /tmp/rep 2>/dev/null; echo

  # ------------------------------------------------------------------
  # Relance en chaîne.
  #
  # Le planificateur de GitHub n'honore pas les crons courts : mesuré sur
  # 18 jours, `*/5` ne s'exécute que 1,9 % du temps et `*/20` 7,6 %, soit
  # un écart médian de ~4 h 20 dans les deux cas. Ce job reprogramme donc
  # l'exécution suivante lui-même, ce qui rend la fréquence indépendante
  # du planificateur. Le cron reste en place : il sert à redémarrer la
  # chaîne si elle casse.
  #
  # Inactif tant que le secret DISPATCH_TOKEN n'existe pas — le workflow
  # se comporte alors exactement comme avant.
  # ------------------------------------------------------------------
  relancer:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Si deux chaînes démarrent en parallèle, la plus ancienne est annulée :
    # on retombe toujours sur une seule chaîne, jamais sur une avalanche.
    concurrency:
      group: relance-dashboard
      cancel-in-progress: true
    steps:
      - name: Programmer la prochaine exécution
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DEPOT: ${{ github.repository }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DISPATCH_TOKEN absent : chaîne inactive, seul le cron déclenche."
            exit 0
          fi
          echo "Attente de 25 min avant la relance…"
          sleep 1500

          api() { curl -sS --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

          # Demande une nouvelle exécution.
          demander() {
            api -o /tmp/rep -w '%{http_code}' -X POST \
              "https://api.github.com/repos/$DEPOT/actions/workflows/dashboard.yml/dispatches" \
              -d '{"ref":"main"}'
          }

          # Une exécution postérieure à la nôtre a-t-elle vraiment démarré ?
          # Les identifiants d'exécution sont croissants : tout id supérieur au
          # nôtre est une exécution créée après nous. On ignore celles que
          # GitHub a refusé de démarrer (startup_failure) ou annulées.
          vivantes() {
            api "https://api.github.com/repos/$DEPOT/actions/workflows/dashboard.yml/runs?per_page=20" \
              | jq --argjson moi "$GITHUB_RUN_ID" '[.workflow_runs[]
                  | select(.id > $moi)
                  | select(.conclusion != "startup_failure" and .conclusion != "cancelled")]
                  | length' 2>/dev/null || echo 0
          }

          # GitHub refuse de démarrer une exécution sur deux ou trois pour cent
          # des demandes (startup_failure, « No jobs were run »). Sans
          # vérification, un seul refus casse la chaîne jusqu'au prochain cron,
          # soit plusieurs heures. On vérifie donc, et on réessaie.
          for essai in 1 2 3; do
            code=$(demander)
            if [ "$code" != "204" ]; then
              echo "Demande refusée (HTTP $code) :"; cat /tmp/rep; echo
            fi
            sleep 60
            if [ "$(vivantes)" -gt 0 ]; then
              echo "Relance confirmée (essai $essai)."
              exit 0
            fi
            echo "Aucune exécution n'a démarré (essai $essai) — nouvelle tentative."
          done

          echo "Trois tentatives sans succès : la chaîne s'arrête ici, le cron reprendra la main."
          exit 1
