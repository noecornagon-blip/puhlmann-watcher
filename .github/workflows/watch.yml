name: Surveiller puhlmann.tv

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Chercher les nouvelles annonces
        run: node watch.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Sauvegarder les annonces vues
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "maj annonces vues"
            git push
          fi
